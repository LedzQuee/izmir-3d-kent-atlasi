
<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 0; overflow-x: hidden; background: #333; height: 100vh; }
#container {
    position: fixed;
    right: 0;
    top: 50%;
    width: 300px;
    height: 70vh;
    background: red;
    transform: translateY(-50%) translateX(100%);
    transition: transform 0.4s;
}
#btn {
    position: absolute;
    left: -44px;
    top: 50%;
    width: 44px;
    height: 64px;
    background: blue;
}
</style>
</head>
<body>
<div id='container'>
  <div id='btn'></div>
</div>
</body>
</html>
